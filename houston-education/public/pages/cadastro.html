<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="../style/estiloLoginCadastro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="shortcut icon" href="../assets/img/iconeHoustonEducation.ico" type="image/x-icon">
</head>

<body>
    <div class="containerPagina">
        <div class="painelLogo">
            <img src="../assets/img/HoustonEducationLogo.png" alt="logo Houston Education">
        </div>

        <div id="dadosCadastro">
            <form id="cadastroForm">
                <h1>Crie sua Conta!</h1>
                <div class="inputDados">
                    <input type="text" name="nome" placeholder="Nome">
                </div>
                <div class="inputDados">
                    <input type="text" name="matricula" placeholder="Matrícula ou CPF" inputmode="numeric" pattern="[0-9]*" minlength="8" maxlength="11" title="A matrícula deve conter entre 8 e 11 dígitos numéricos">
                </div>
                <div class="inputDados">
                    <input type="email" name="email" placeholder="Email Institucional">
                </div>
                <div class="inputDados input-senha-wrapper">
                    <input type="password" name="senha" id="inputSenhaCadastro" placeholder="Senha">
                    <button type="button" class="btn-toggle-senha" id="btnToggleSenhaCadastro" aria-label="Mostrar senha">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <button type="submit" id="btnCadastrar">
                    <span class="btn-text">Cadastrar</span>
                    <span class="btn-spinner hidden"><i class="fas fa-circle-notch fa-spin"></i></span>
                </button>
            </form>
            <p>Já Possui Conta? <a href="login.html">Faça seu login!</a></p>
            <div id="mensagem"></div>
        </div>
    </div>


    <script src="../scripts/validation/validationCadastro.js"></script>
</body>

</html>
