<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Proposta de página · Gabriel Abreu</title>
<style>html,body{margin:0;height:100%;background:#f4f4f5;font-family:system-ui,sans-serif}iframe{border:0;width:100%;height:100%;display:block}p{padding:40px 20px;text-align:center;color:#555}</style>
</head>
<body>
<p id="msg">Carregando a proposta…</p>
<script>
// Página pública da proposta. O HTML gerado roda num iframe sem scripts e sem acesso a esta origem.
(async () => {
  const msg = document.getElementById('msg');
  const t = new URLSearchParams(location.search).get('t') || '';
  if (!/^[a-f0-9]{24,64}$/.test(t)) { msg.textContent = 'Link inválido.'; return; }
  const SB = 'https://nzydtjhcibzazcotyabp.supabase.co';
  const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56eWR0amhjaWJ6YXpjb3R5YWJwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5MjAyODMsImV4cCI6MjEwNzQ5NjI4M30.AH5bsGSkYnr5C9U6uU4fptlNuH8kz8775x3NFu93e6c';
  try {
    const r = await fetch(SB + '/rest/v1/rpc/mockup_publico', { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ t }) });
    const d = await r.json();
    if (!r.ok || !Array.isArray(d) || !d[0]?.html) { msg.textContent = 'Proposta não encontrada.'; return; }
    document.title = 'Proposta · ' + d[0].nome;
    const f = document.createElement('iframe');
    f.setAttribute('sandbox', '');
    f.setAttribute('title', 'Proposta de página para ' + d[0].nome);
    f.srcdoc = d[0].html;
    msg.replaceWith(f);
  } catch (e) { msg.textContent = 'Não consegui carregar a proposta agora.'; }
})();
</script>
</body>
</html>
